name: SCANUE Pages

on:
  pull_request:
    paths:
      - docs/pages/**
      - public/index.html
      - .github/workflows/static.yml
  push:
    branches: [main]
    paths:
      - docs/pages/**
      - public/index.html
      - .github/workflows/static.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scanue-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package SCANUE site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Stage the static site
        run: |
          test -s docs/pages/index.html
          test -s public/index.html
          install -D -m 644 docs/pages/index.html "$RUNNER_TEMP/scanue-site/index.html"
          install -D -m 644 public/index.html "$RUNNER_TEMP/scanue-site/public/index.html"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/scanue-site

  deploy:
    name: Deploy SCANUE site
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
