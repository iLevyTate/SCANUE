<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find the SCANUE source code and instructions for running its dashboard locally.">
  <link rel="canonical" href="https://ilevytate.github.io/SCANUE/">
  <title>SCANUE</title>
  <style>
    :root {
      color-scheme: light dark;
      font: 100%/1.65 system-ui, sans-serif;
      color: light-dark(#202438, #eef0fa);
      background: light-dark(#f5f6fc, #151829);
    }
    main {
      max-width: 38rem;
      margin-inline: auto;
      padding: clamp(2rem, 8vw, 6rem) 1.25rem;
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 12vw, 6rem);
      line-height: 1;
      letter-spacing: -.05em;
    }
    ul {
      display: flex;
      flex-wrap: wrap;

      border-top: 1px solid light-dark(#7e86a0, #8993b4);
      list-style: none;
    }
    a {
      color: light-dark(#4333a3, #bdc5ff);

  <main>
    <h1>SCANUE</h1>
    <p>SCANUE is a JavaScript project that uses specialized AI agents to analyze text. Start the SCANUE server locally to run analyses from the browser dashboard.</p>
    <nav aria-label="Project links">
      <ul>
        <li><a href="https://github.com/iLevyTate/SCANUE#running-the-project">Run SCANUE locally</a></li>
